<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroVet AI — Digital Veterinary Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1E4D2B 0%, #0a1f14 50%, #000000 100%);
            color: #e0f2e9;
            min-height: 100vh;
        }
        .table {
            background-color: rgba(30, 77, 43, 0.85);
            border: 1px solid #4ade80;
            border-radius: 12px;
            overflow: hidden;
        }
        .table thead {
            background-color: #1E4D2B;
            color: white;
        }
        .alert-3 { background-color: #5c2a2a !important; color: #ffcccc; }
        .alert-2 { background-color: #5c4a1f !important; color: #fff3cd; }
        
        h1, h4 { color: #a1e8b8; text-shadow: 0 0 10px #4ade80; }
        
        .cow-id { color: #4ade80 !important; font-weight: bold; }
        .btn-open {
            background-color: #4ade80;
            color: #1E4D2B;
            font-weight: bold;
        }
        .btn-open:hover { background-color: #22c55e; }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold">AgroVet AI</h1>
            <p class="lead">Digital Veterinary Assistant</p>
        </div>

        <div class="d-flex gap-3 justify-content-center flex-wrap mb-4">
            <label class="btn btn-outline-light btn-lg">
                <i class="bi bi-upload"></i> Загрузить Excel с данными стада
                <input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none" onchange="uploadExcel(this)">
            </label>
            <button onclick="clearData()" class="btn btn-outline-danger btn-lg">
                <i class="bi bi-trash"></i> Очистить данные
            </button>
        </div>

        <h4 class="mb-3">Стадо коров</h4>
        <div class="table-responsive mb-5">
            <table class="table table-hover align-middle" id="cowsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Кличка</th>
                        <th>Порода</th>
                        <th>Вес (кг)</th>
                        <th>BCS</th>
                        <th>Дата последнего взвешивания</th>
                        <th>Анализ</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <h4 class="mb-3">🚨 Тревожный список</h4>
        <div class="table-responsive">
            <table class="table table-hover" id="alertsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Кличка</th>
                        <th>Тип аномалии</th>
                        <th>Серьёзность</th>
                        <th>Описание</th>
                        <th>Рекомендация</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function loadCows() {
            fetch('/api/cows', { cache: 'no-store' })
                .then(r => r.json())
                .then(cows => {
                    const tbody = document.querySelector('#cowsTable tbody');
                    tbody.innerHTML = '';
                    cows.forEach(cow => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><a href="/cow/${cow.id}" class="cow-id">${cow.id}</a></td>
                            <td>${cow.nickname}</td>
                            <td>${cow.breed}</td>
                            <td>${cow.last_weight || '-'}</td>
                            <td>${cow.last_bcs || '-'}</td>
                            <td>${cow.last_date || '-'}</td>
                            <td>
                                <a href="/cow/${cow.id}" class="btn btn-open btn-sm">
                                    <i class="bi bi-eye"></i> Открыть
                                </a>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                });
        }

        function loadAlerts() {
            fetch('/api/analyze', { method: 'POST', cache: 'no-store' })
                .then(r => r.json())
                .then(alerts => {
                    const tbody = document.querySelector('#alertsTable tbody');
                    tbody.innerHTML = '';
                    if (alerts.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-light py-3">Нет аномалий</td></tr>`;
                        return;
                    }
                    alerts.forEach(a => {
                        const tr = document.createElement('tr');
                        tr.className = `alert-${a.severity || 1}`;
                        tr.innerHTML = `
                            <td>${a.cow_id}</td>
                            <td>${a.nickname}</td>
                            <td>${a.type}</td>
                            <td><strong>${a.severity}</strong></td>
                            <td>${a.description}</td>
                            <td>${a.recommendation}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                });
        }

        function clearData() {
            if (confirm("Очистить все данные?")) {
                fetch('/api/clear', { method: 'POST' })
                    .then(() => {
                        loadCows();
                        loadAlerts();
                    });
            }
        }

        function uploadExcel(input) {
            const file = input.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            fetch('/api/upload_excel', {
                method: 'POST',
                body: formData
            })
            .then(r => r.json())
            .then(data => {
                alert(data.message || data.error);
                loadCows();
                loadAlerts();
            })
            .catch(() => alert("Ошибка загрузки файла"));
        }

        window.onload = () => {
            loadCows();
            loadAlerts();
        };
    </script>
</body>
</html>
